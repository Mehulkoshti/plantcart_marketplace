{% extends "base.html" %}

{% block title %}My Profile - PlantCart{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-5">
                <div class="text-center mb-5">
                    <div class="bg-light-green rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3"
                        style="width: 100px; height: 100px;">
                        <i class="fas fa-user text-primary-green fa-3x"></i>
                    </div>
                    <h2 class="fw-bold mb-0">My Profile</h2>
                    <p class="text-muted">Manage your personal information</p>
                </div>

                <form method="post">
                    {% csrf_token %}

                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">First Name</label>
                            {{ form.first_name }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Last Name</label>
                            {{ form.last_name }}
                        </div>
                        <div class="col-md-12">
                            <label class="form-label small fw-bold">Email Address</label>
                            <input type="text" class="form-control" value="{{ user.email }}" disabled>
                            <div class="form-text">Email cannot be changed.</div>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label small fw-bold">Phone Number</label>
                            {{ form.phone_number }}
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-5">
                        <a href="{% url 'products:home' %}" class="btn btn-light px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary-custom px-5">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
