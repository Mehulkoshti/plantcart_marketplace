{% extends "base.html" %}

{% block title %}Delete {{ object.name }} - PlantCart{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-4 p-5 text-center">
            <div class="mb-4">
                <i class="fas fa-exclamation-triangle fa-4x text-warning"></i>
            </div>
            <h2 class="fw-bold mb-3">Delete Plant?</h2>
            <p class="text-muted mb-4">Are you sure you want to delete "<strong>{{ object.name }}</strong>"? This action
                cannot be undone.</p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-3 justify-content-center">
                    <a href="{% url 'products:vendor_dashboard' %}"
                        class="btn btn-light px-4 py-2 rounded-pill">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4 py-2 rounded-pill">Yes, Delete It</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
